<style>
  /* Cores e medidas: mude aqui e vale para todas as telas */
  :root {
    color-scheme: dark;
    --bg: #0f1115;
    --surface: #181b22;
    --surface2: #1f232c;
    --border: #2a2f3a;
    --text: #e6e8ec;
    --muted: #8b93a1;
    --accent: #4f8cff;
    --ok: #34d399;
    --bad: #f87171;
    --ok-bg: rgba(52, 211, 153, .08);
    --bad-bg: rgba(248, 113, 113, .08);
    --ok-line: rgba(52, 211, 153, .4);
    --bad-line: rgba(248, 113, 113, .4);
    --warn: #fbbf24;
    --info: #60a5fa;
    --warn-line: rgba(251, 191, 36, .45);
    --info-line: rgba(96, 165, 250, .45);
    --reembolso: #fb923c;
    --reembolso-line: rgba(251, 146, 60, .45);
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
    line-height: 1.45;
  }
  a { color: var(--accent); text-decoration: none; }
  a:hover { text-decoration: underline; }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

  /* Títulos */
  h1 { font-size: 1.5rem; margin: .25rem 0 1rem; }
  h2 {
    font-size: .8rem; margin: 2rem 0 .6rem; color: var(--muted); font-weight: 600;
    text-transform: uppercase; letter-spacing: .06em;
  }
  h3 { font-size: 1rem; margin: 1.25rem 0 .5rem; }
  .voltar { margin: .5rem 0 0; font-size: .85rem; }

  /* Página */
  .wrap { max-width: 1040px; margin: 0 auto; padding: 1.25rem 1rem 3rem; }

  /* Menu superior fixo */
  .topbar {
    position: sticky; top: 0; z-index: 10;
    background: rgba(15, 17, 21, .92); backdrop-filter: blur(8px);
    border-bottom: 1px solid var(--border);
  }
  .topbar-inner {
    max-width: 1040px; margin: 0 auto; padding: .6rem 1rem;
    display: flex; align-items: center; gap: 1.25rem;
  }
  .brand { display: flex; align-items: center; gap: .5rem; font-weight: 700; color: var(--text); white-space: nowrap; }
  .brand:hover { text-decoration: none; }
  .brand-icon { width: 26px; height: 26px; flex: none; }
  .menu { display: flex; gap: .25rem; overflow-x: auto; scrollbar-width: none; }
  .menu::-webkit-scrollbar { display: none; }
  .menu a { color: var(--muted); padding: .4rem .75rem; border-radius: 8px; white-space: nowrap; }
  .menu a:hover { color: var(--text); background: var(--surface2); text-decoration: none; }
  .menu a.active {
    color: var(--text); background: var(--surface2); box-shadow: inset 0 -2px 0 var(--accent);
  }

  /* Navegação de mês: a mesma em todas as telas que têm mês */
  .monthnav {
    display: flex; align-items: center; justify-content: center;
    gap: .75rem; margin: .5rem 0 1.25rem;
  }
  .monthnav strong { min-width: 9rem; text-align: center; font-size: 1.2rem; font-variant-numeric: tabular-nums; }
  .monthnav a.seta {
    display: inline-flex; align-items: center; justify-content: center;
    width: 2.25rem; height: 2.25rem; border: 1px solid var(--border); border-radius: 999px;
    background: var(--surface); color: var(--text); font-size: 1.2rem; line-height: 1;
  }
  .monthnav a.seta:hover { border-color: var(--accent); color: var(--accent); text-decoration: none; }
  .monthnav a.hoje { font-size: .85rem; }

  /* Título seguido da navegação de mês: a margem do título já separa, sem somar */
  h1 + .monthnav { margin-top: -.5rem; }

  /* Cartões de resumo */
  .cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: .75rem; }
  .card { background: var(--surface); border: 1px solid var(--border); border-radius: 14px; padding: 1rem 1.1rem; }
  .card small {
    display: block; color: var(--muted); font-size: .72rem; margin-bottom: .35rem;
    text-transform: uppercase; letter-spacing: .05em;
  }
  .card .val { font-size: 1.35rem; font-weight: 650; font-variant-numeric: tabular-nums; }

  /* Painéis e avisos */
  .panel {
    background: var(--surface); border: 1px solid var(--border); border-radius: 14px;
    padding: 1rem 1.1rem; margin: 1rem 0;
  }
  .banner {
    background: var(--surface); border: 1px solid var(--border); border-radius: 12px;
    padding: .75rem 1rem; margin: 1rem 0;
  }
  .banner.erro { border-color: var(--bad-line); background: var(--bad-bg); }
  .banner.ok { border-color: var(--ok-line); background: var(--ok-bg); }
  .banner ul { margin: .5rem 0 0; padding-left: 1.2rem; }
  .muted { color: var(--muted); }
  .aviso { color: var(--muted); font-size: .85rem; }
  .ok { color: var(--ok); }
  .bad { color: var(--bad); }
  .val.ok { color: var(--ok); }
  .val.bad { color: var(--bad); }

  /* Caixinhas (pills) */
  .pill {
    display: inline-block; font-size: .72rem; padding: .1rem .5rem; border-radius: 999px;
    background: var(--surface2); border: 1px solid var(--border); color: var(--muted);
    margin-left: .25rem; white-space: nowrap;
  }
  .pill.ok { color: var(--ok); border-color: var(--ok-line); }
  .pill.bad { color: var(--bad); border-color: var(--bad-line); }
  .pill.aberta { color: var(--info); border-color: var(--info-line); }
  .pill.fechada { color: var(--warn); border-color: var(--warn-line); }
  .pill.sem { color: var(--muted); }
  .pill.reembolso { color: var(--reembolso); border-color: var(--reembolso-line); }
  a.pill:hover { border-color: var(--accent); color: var(--accent); text-decoration: none; }
  .celula-valor { display: inline-flex; align-items: center; justify-content: center; gap: .4rem; }
  .celula-valor .pill { margin: 0; }

  /* Tabelas dentro de painéis */
  table { width: 100%; border-collapse: collapse; font-variant-numeric: tabular-nums; }
  th {
    text-align: center; font-size: .7rem; text-transform: uppercase; letter-spacing: .05em;
    color: var(--muted); font-weight: 600; padding: .6rem .75rem;
    border-bottom: 1px solid var(--border); background: var(--surface2); white-space: nowrap;
  }
  td {
    text-align: center; vertical-align: middle; padding: .6rem .75rem;
    border-bottom: 1px solid var(--border);
  }
  tr:last-child td { border-bottom: none; }
  tbody tr:hover td { background: rgba(255, 255, 255, .02); }
  th.desc, td.desc, td.nome-caixinha { text-align: left; }
  tr.grupo td { background: rgba(255, 255, 255, .04); font-weight: 600; text-align: left; }
  /* Faixa colorida à esquerda: verde para receita, vermelho para despesa */
  tr.linha-receita td:first-child { box-shadow: inset 4px 0 0 var(--ok); }
  tr.linha-despesa td:first-child { box-shadow: inset 4px 0 0 var(--bad); }
  tr.linha-reembolso td:first-child { box-shadow: inset 4px 0 0 var(--reembolso); }
  tr.grupo-reembolso td { color: var(--reembolso); }
  .card .val.reembolso { color: var(--reembolso); }
  /* Colunas estreitas ocupam só o espaço do conteúdo */
  th.col-estreita, td.col-estreita { width: 1%; white-space: nowrap; }
  /* Status com a mesma largura em todas as tabelas */
  td.status .pill {
    display: inline-flex; align-items: center; justify-content: center;
    min-width: 6.5rem; margin: 0;
  }

  /* Botões: dois tamanhos só. Padrão para formulários, pequeno para tabelas */
  button, .btn {
    font: inherit; font-size: .9rem; line-height: 1;
    display: inline-flex; align-items: center; justify-content: center;
    height: 2.4rem; padding: 0 .9rem; border-radius: 8px; white-space: nowrap;
    border: 1px solid var(--border); background: var(--surface2); color: var(--text);
    cursor: pointer; text-decoration: none;
  }
  button:hover, .btn:hover { border-color: var(--accent); text-decoration: none; }
  .primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  .primary:hover { color: #fff; filter: brightness(1.08); }
  .danger { color: var(--bad); background: transparent; }
  .danger:hover { border-color: var(--bad); }
  .small { height: 2rem; min-width: 5.5rem; padding: 0 .6rem; font-size: .8rem; }
  /* Ação só com ícone (Editar, Excluir, Ver) nas linhas das tabelas */
  button.icon, .btn.icon { width: 2rem; min-width: 2rem; height: 2rem; padding: 0; }
  .inline { display: inline; margin: 0; }

  /* Ações de cada linha: sempre uma linha, centralizadas */
  .acoes { display: flex; justify-content: center; align-items: center; flex-wrap: nowrap; gap: .4rem; }
  .acoes.esq { justify-content: flex-start; }
  .acoes.topo { margin-top: 1rem; }
  .acoes form { margin: 0; display: flex; }

  /* Campos */
  input, select, textarea {
    font: inherit; width: 100%; min-width: 0; padding: .5rem .6rem;
    border-radius: 8px; border: 1px solid var(--border); background: var(--bg); color: var(--text);
  }
  input:focus, select:focus, textarea:focus { outline: none; border-color: var(--accent); }
  input[type=checkbox], input[type=radio] { width: auto; margin: 0; }
  input[type=file] { padding: .4rem .5rem; }
  label {
    display: flex; flex-direction: column; gap: .3rem; min-width: 0;
    font-size: .8rem; color: var(--muted);
  }
  label.check {
    flex-direction: row; align-items: center; gap: .45rem; width: auto; justify-self: start;
    font-size: .9rem; color: var(--text);
  }
  /* Campos de tabela: tamanho fixo */
  input.campo-valor { width: 5.5rem; height: 2rem; padding: .3rem .4rem; font-size: .8rem; text-align: center; }
  input.campo-data { width: 7.5rem; height: 2rem; padding: .3rem .4rem; font-size: .8rem; }

  /* Formulários em grade. --cols define quantas colunas no computador */
  form.grid {
    display: grid; grid-template-columns: repeat(var(--cols, 4), minmax(0, 1fr));
    gap: .75rem; align-items: end;
  }
  form.grid .span2 { grid-column: span 2; }
  form.grid .span3 { grid-column: span 3; }
  form.grid .span4 { grid-column: span 4; }
  form.grid .span5 { grid-column: span 5; }
  form.grid .todo { grid-column: 1 / -1; }
  form.grid > .acao { display: flex; justify-content: flex-end; }
  form.grid > .linha-acao { display: flex; justify-content: flex-end; align-items: end; }

  /* Linha de campos simples (ex.: nome e dia do cartão em Cadastrados) */
  .linha { display: flex; flex-wrap: wrap; gap: .5rem; align-items: center; }
  .linha .campo-nome { flex: 1 1 14rem; min-width: 0; }
  .linha .campo-dia { width: 5rem; }

  /* Dois campos lado a lado dentro de um rótulo (mês e ano) */
  .duo { display: flex; gap: .5rem; }
  .duo > select { flex: 1; }

  /* Planos de parcelamento: faixa colorida pela direção do dinheiro */
  .panel.plano-pagar { border-left: 4px solid var(--bad); }
  .panel.plano-receber { border-left: 4px solid var(--reembolso); }
  .plano-titulo { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: .5rem; }
  .plano-titulo h3 { margin: .25rem 0; }

  /* Ações soltas no fim da página, e o campo "Quem paga" na prévia */
  .barra-final { display: flex; justify-content: flex-end; margin-top: 1rem; }
  .campo-pessoa { margin-top: .3rem; min-width: 12rem; }
  .campo-pessoa small { display: block; margin-top: .3rem; }

  /* Gráficos */
  .chart { position: relative; height: 260px; }

  @media (max-width: 640px) {
    .wrap { padding: 1rem 16px 2rem; }
    h1 { font-size: 1.3rem; }
    .topbar-inner { padding: .5rem 16px; gap: .75rem; }
    .menu a { padding: .45rem .7rem; }
    .cards { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    .card .val { font-size: 1.15rem; }
    .monthnav strong { min-width: 7rem; font-size: 1.05rem; }
    .panel { overflow-x: auto; padding: .75rem; }
    .panel table { min-width: 520px; }
    table { font-size: .85rem; }
    th, td { padding: .45rem .5rem; }
    form.grid { grid-template-columns: minmax(0, 1fr); }
    form.grid > .span2, form.grid > .span3, form.grid > .span4, form.grid > .span5 { grid-column: auto; }
    form.grid > .acao, form.grid > .linha-acao { justify-content: stretch; }
    form.grid > .acao > button, form.grid > .linha-acao > button { width: 100%; }
    .linha .campo-dia { width: 100%; }
  }
</style>
