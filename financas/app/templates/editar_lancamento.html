<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Editar lançamento · FinHome</title>
  {% include "_style.html" %}
</head>
<body>
{% include "_nav.html" %}
{% import "_macros.html" as m %}
<div class="wrap">
  {{ m.voltar(base() ~ '/?mes=' ~ tx.due_date.strftime('%Y-%m')) }}
  <h1>Editar lançamento</h1>

  {% if erro %}{{ m.erro(erro) }}{% endif %}

  <div class="panel">
    <form class="grid" style="--cols: 5" method="post" action="{{ base() }}/lancamentos/{{ tx.id }}/editar">
      <label class="span2">Descrição<input name="description" value="{{ tx.description }}" required></label>
      <label>Valor (R$)<input name="amount" value="{{ '%.2f'|format(tx.amount_cents / 100) | replace('.', ',') }}" required></label>
      <label>Vencimento<input type="date" name="due_date" value="{{ tx.due_date.isoformat() }}" required></label>
      <label>Tipo
        <select name="kind">
          <option value="despesa" {{ 'selected' if tx.kind == 'despesa' }}>Despesa</option>
          <option value="receita" {{ 'selected' if tx.kind == 'receita' }}>Receita</option>
        </select>
      </label>
      <label class="span3">Categorias (separadas por vírgula)<input name="tags" value="{{ tags_text }}" placeholder="mercado, lazer"></label>
      <button type="submit" class="primary">Salvar</button>
    </form>
  </div>
</div>
</body>
</html>
