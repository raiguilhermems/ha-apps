<style>
  @media (max-width: 640px) {
    .topbar-inner { flex-wrap: wrap; }
    .topbar .brand { width: 100%; }
    .topbar .menu {
      display: flex; flex-wrap: nowrap; width: 100%;
      overflow-x: auto; white-space: nowrap;
      scrollbar-width: none; -webkit-overflow-scrolling: touch;
    }
    .topbar .menu::-webkit-scrollbar { display: none; }
    .topbar .menu a { flex: 0 0 auto; padding: .45rem .8rem; }
  }
</style>
<header class="topbar">
  <div class="topbar-inner">
    <a class="brand" href="{{ base() }}/">Finanças</a>
    <nav class="menu">
      <a href="{{ base() }}/" class="{{ 'active' if request.url.path == '/' else '' }}">Início</a>
      <a href="{{ base() }}/parcelados" class="{{ 'active' if request.url.path.startswith('/parcelados') else '' }}">Parcelados</a>
      <a href="{{ base() }}/recorrentes" class="{{ 'active' if request.url.path.startswith('/recorrentes') else '' }}">Recorrentes</a>
      <a href="{{ base() }}/categorias" class="{{ 'active' if request.url.path.startswith('/categorias') else '' }}">Categorias</a>
      <a href="{{ base() }}/cartoes" class="{{ 'active' if request.url.path.startswith('/cartoes') else '' }}">Cartões</a>
      <a href="{{ base() }}/investimentos" class="{{ 'active' if request.url.path.startswith('/investimentos') else '' }}">Investimentos</a>
      <a href="{{ base() }}/configuracoes" class="{{ 'active' if request.url.path.startswith('/configuracoes') else '' }}">Configurações</a>
    </nav>
  </div>
</header>
